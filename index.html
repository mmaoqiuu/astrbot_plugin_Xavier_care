<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#d9c7ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>小狗健康</title>
  <link rel="icon" href="/health/assets/兔球球.png" type="image/png">
  <link rel="apple-touch-icon" href="/health/assets/兔球球.png">
  <!-- 本机用本地 chart.umd.min.js，别改回 CDN（服务器拉不到） -->
  <script src="/health/assets/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { background-color: #d9c7ff; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #d9c7ff 0%, #e8dcff 18%, #f3ecff 38%, #faf8ff 60%);
      background-attachment: fixed;
      color: #333;
      padding: env(safe-area-inset-top, 16px) 20px 40px;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景星星 */
    .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .sky span {
      position: absolute; color: #c9b6ff; opacity: 0.55;
      animation: twinkle 4.5s ease-in-out infinite;
    }
    .sky .mascot-bunny {
      position: absolute; bottom: 20px; right: 10px;
      width: 160px; height: 160px; object-fit: contain;
      opacity: 0.16; pointer-events: none;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.9); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .spinning { display: inline-block; animation: spin 0.8s linear infinite; }

    .page { position: relative; z-index: 1; }

    /* 顶部标题 */
    .header { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; margin-bottom: 18px; }
    .header-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 20px; font-weight: 700; color: #3a2f57; letter-spacing: -0.2px;
    }
    .header-title .logo {
      width: 50px; height: 50px; object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(156, 123, 255, 0.3));
    }

    /* 视图切换 tab */
    .view-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .view-tab {
      flex: 1; padding: 8px 0; border-radius: 12px;
      border: 1px solid #e4daff; background: #f7f3ff; color: #7d63c4;
      font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;
      transition: all 0.2s;
    }
    .view-tab.active {
      background: linear-gradient(135deg, #b79bff, #9c7bff);
      color: #fff; border-color: transparent;
      box-shadow: 0 3px 10px rgba(156, 123, 255, 0.35);
    }

    /* 女性健康卡片 */
    .period-card {
      background: linear-gradient(135deg, #e8dcff 0%, #f3e6ff 55%, #efe0ff 100%);
      border-radius: 24px; padding: 22px 24px; margin-bottom: 18px;
      position: relative;
      box-shadow: 0 6px 20px rgba(167, 139, 250, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.7);
      overflow: hidden; min-height: 118px;
    }
    .period-card::after {
      content: ""; position: absolute; right: -15px; bottom: -22px;
      width: 140px; height: 140px;
      background: url("/health/assets/星际小宝.png") no-repeat center / contain;
      opacity: 0.85;
    }
    .period-subtitle { font-size: 13px; color: #7d63c4; font-weight: 500; margin-bottom: 8px; }
    .period-main { display: flex; justify-content: space-between; align-items: center; }
    .period-title { font-size: 20px; font-weight: 700; color: #4a2f8f; letter-spacing: -0.3px; }
    .period-desc { font-size: 13px; color: #7a67a8; margin-top: 8px; }

    /* 状态行 */
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 4px; }
    .status-time { font-size: 12px; color: #8b86a3; letter-spacing: -0.1px; }
    .btn-refresh {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px; color: #8b6cff;
      background: #f3eeff; border: 1px solid #e4daff;
      border-radius: 6px; padding: 3px 8px; cursor: pointer;
      font-weight: 500; transition: all 0.2s; font-family: inherit;
    }
    .btn-refresh:active { transform: scale(0.96); background: #e4daff; }

    /* 四宫格 */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .card {
      background: #fff; border-radius: 22px; padding: 18px;
      box-shadow: 0 6px 20px rgba(150, 120, 255, 0.06);
      border: 1px solid #f0e9ff;
      display: flex; flex-direction: column; position: relative; overflow: hidden;
    }
    .card::after {
      content: "✦"; position: absolute; top: 12px; right: 14px;
      font-size: 12px; color: #ded0ff;
    }
    .card-icon { font-size: 24px; margin-bottom: 8px; display: inline-block; }
    .card-label { font-size: 13px; color: #8c8888; font-weight: 500; margin-bottom: 4px; }
    .card-value-wrap { display: flex; align-items: baseline; gap: 4px; margin-bottom: 12px; }
    .card-value {
      font-size: 28px; font-weight: 700; color: #2a2440; line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .card-unit { font-size: 13px; color: #948dab; font-weight: 500; }
    .card-subtext {
      font-size: 11px; color: #b5b0c7; margin-top: auto;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* 宽卡 */
    .wide-card {
      background: #fff; border-radius: 22px; padding: 18px 20px;
      box-shadow: 0 6px 20px rgba(150, 120, 255, 0.06);
      border: 1px solid #f0e9ff; margin-bottom: 16px;
      position: relative; overflow: hidden;
    }
    .wide-card::after {
      content: "✧"; position: absolute; top: 14px; right: 16px;
      font-size: 14px; color: #ded0ff;
    }
    .wide-card .card-icon { margin-bottom: 8px; }
    .wide-card .card-label { font-size: 13px; color: #8c8888; margin-bottom: 4px; }
    .wide-card .card-value-wrap { margin-bottom: 10px; }
    .wide-card .card-subtext { font-size: 11px; color: #b5b0c7; }

    /* 空状态 */
    .empty-state { text-align: center; padding: 30px 0 10px; color: #b0a9c6; font-size: 13px; }
    .empty-state img {
      width: 120px; height: 120px; object-fit: contain;
      opacity: 0.85; margin-bottom: 10px;
      filter: drop-shadow(0 4px 12px rgba(156, 123, 255, 0.2));
    }

    /* 体重图 */
    .chart-wrap { position: relative; width: 100%; height: 220px; margin-top: 10px; }

    /* 日历卡片 */
    .cal-card {
      background: #fff; border-radius: 22px; padding: 18px 16px 14px;
      box-shadow: 0 6px 20px rgba(150, 120, 255, 0.06);
      border: 1px solid #f0e9ff; margin-bottom: 16px;
      position: relative; overflow: hidden;
    }
    .cal-card::after {
      content: ""; position: absolute;
      right: -60px; bottom: -60px;
      width: 260px; height: 260px;
      background: url("/health/assets/兔球球.png") no-repeat center / contain;
      opacity: 0.20; pointer-events: none;
    }
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .cal-nav .month { font-size: 17px; font-weight: 700; color: #4a2f8f; }
    .cal-nav button {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid #e4daff; background: #f7f3ff;
      color: #7d63c4; font-size: 18px; cursor: pointer;
      font-family: inherit; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-nav button:active { background: #e4daff; }
    .cal-nav .today-btn { width: auto; padding: 0 12px; border-radius: 10px; font-size: 13px; height: 30px; }

    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: #8b86a3; margin-bottom: 10px; position: relative; z-index: 1; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
    .legend .dot-mark { background: #f06292; }
    .legend .dot-pred { background: #f8bbd0; }

    .cal-week {
      display: grid; grid-template-columns: repeat(7, 1fr);
      text-align: center; font-size: 11px; color: #b5b0c7;
      margin-bottom: 4px; position: relative; z-index: 1;
    }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 2px; position: relative; z-index: 1;
    }
    .cal-cell {
      aspect-ratio: 1 / 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border-radius: 50%;
      font-size: 14px; color: #2a2440;
      cursor: pointer; position: relative;
      transition: background 0.15s;
    }
    .cal-cell.empty { cursor: default; }
    .cal-cell:not(.empty):active { background: #f3eeff; }
    .cal-cell.today { box-shadow: inset 0 0 0 2px #9c7bff; font-weight: 700; }
    .cal-cell.marked {
      background: linear-gradient(135deg, #f48fb1, #f06292);
      color: #fff; font-weight: 700;
      box-shadow: 0 2px 8px rgba(240, 98, 146, 0.35);
    }
    .cal-cell.pred { background: #fce4ec; color: #c2185b; }
    .cal-cell .dot {
      position: absolute; bottom: 5px;
      width: 4px; height: 4px; border-radius: 50%;
    }
    .cal-cell.marked .dot { background: #fff; }

    /* 底部状态小卡 */
    .period-status {
      background: linear-gradient(135deg, #e8dcff 0%, #f3e6ff 55%, #efe0ff 100%);
      border-radius: 22px; padding: 16px 20px;
      box-shadow: 0 6px 20px rgba(167, 139, 250, 0.18);
      border: 1px solid rgba(255,255,255,0.7);
      font-size: 13px; color: #4a2f8f; line-height: 1.9;
    }
    .period-status .big { font-size: 18px; font-weight: 700; color: #4a2f8f; margin-bottom: 6px; }
    .period-status .row { display: flex; justify-content: space-between; }

    /* 弹窗 */
    .modal-mask {
      position: fixed; inset: 0;
      background: rgba(40, 30, 60, 0.35);
      display: none; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: #fff; border-radius: 20px; width: 100%; max-width: 320px;
      padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal h3 { font-size: 16px; color: #4a2f8f; margin-bottom: 4px; }
    .modal .date-str { font-size: 13px; color: #8b86a3; margin-bottom: 16px; }
    .modal button {
      width: 100%; padding: 11px 0; border-radius: 12px;
      font-size: 14px; font-weight: 500; cursor: pointer;
      font-family: inherit; border: none; margin-bottom: 8px;
    }
    .modal .btn-mark { background: linear-gradient(135deg, #f48fb1, #f06292); color: #fff; }
    .modal .btn-unmark { background: #f3eeff; color: #7d63c4; border: 1px solid #e4daff; }
    .modal .btn-cancel { background: #f7f7fa; color: #8b86a3; margin-bottom: 0; }
  </style>
</head>
<body>

  <div class="sky" aria-hidden="true">
    <span style="top: 8%;  left: 6%;  font-size: 12px;">✦</span>
    <span style="top: 20%; left: 88%; font-size: 10px; animation-delay: 1.2s;">✧</span>
    <span style="top: 36%; left: 3%;  font-size: 9px;  animation-delay: 2.1s;">✦</span>
    <span style="top: 58%; left: 92%; font-size: 11px; animation-delay: 0.6s;">✧</span>
    <span style="top: 74%; left: 8%;  font-size: 10px; animation-delay: 1.8s;">✦</span>
    <span style="top: 90%; left: 80%; font-size: 12px; animation-delay: 2.6s;">✧</span>
    <img class="mascot-bunny" src="/health/assets/星际小宝.png" alt="">
  </div>

  <div class="page">

    <div class="header">
      <div class="header-title">
        <img class="logo" src="/health/assets/兔球球.png" alt="logo">
        小狗健康
      </div>
    </div>

    <div class="view-tabs">
      <button class="view-tab active" data-view="today" onclick="switchView('today')">今日</button>
      <button class="view-tab" data-view="weight" onclick="switchView('weight')">体重</button>
      <button class="view-tab" data-view="calendar" onclick="switchView('calendar')">日历</button>
    </div>

    <!-- ====== 今日 ====== -->
    <div id="todayView">
      <div class="period-card" id="periodCard">
        <div class="period-subtitle">女性健康</div>
        <div class="period-main">
          <div class="period-title" id="periodTitle">今日 · 经期护理</div>
        </div>
        <div class="period-desc" id="periodDesc">暂无经期数据</div>
      </div>

      <div class="status-bar">
        <div class="status-time" id="statusTime">数据更新于 --:--:--</div>
        <button class="btn-refresh" id="btnRefresh" onclick="fetchData()">
          <span id="refreshIcon">🔄</span> 刷新数据
        </button>
      </div>

      <div class="empty-state" id="emptyState" style="display:none;">
        <img src="/health/assets/星际小宝.png" alt="">
        <div>还没有收到身体数据哦～</div>
      </div>

      <div id="dataArea" style="display:none;">
        <div class="grid">
          <div class="card">
            <div class="card-icon">❤️</div>
            <div class="card-label">心率</div>
            <div class="card-value-wrap">
              <div class="card-value" id="valHr">--</div>
              <div class="card-unit">bpm</div>
            </div>
            <div class="card-subtext" id="subHr">静息 -- · 步行 --</div>
          </div>

          <div class="card">
            <div class="card-icon">🫁</div>
            <div class="card-label">血氧</div>
            <div class="card-value-wrap">
              <div class="card-value" id="valOxygen">--</div>
              <div class="card-unit">%</div>
            </div>
            <div class="card-subtext" id="subOxygen">最近一次读数</div>
          </div>

          <div class="card">
            <div class="card-icon">🐾</div>
            <div class="card-label">今日步数</div>
            <div class="card-value-wrap">
              <div class="card-value" id="valSteps">--</div>
              <div class="card-unit">步</div>
            </div>
            <div class="card-subtext" id="subSteps">-- km</div>
          </div>

          <div class="card">
            <div class="card-icon">😴</div>
            <div class="card-label">昨晚睡眠</div>
            <div class="card-value-wrap">
              <div class="card-value" id="valSleepHrs">--</div>
              <div class="card-unit">小时</div>
            </div>
            <div class="card-subtext" id="subSleep">--</div>
          </div>
        </div>

        <div class="wide-card">
          <div class="card-icon">🌟</div>
          <div class="card-label">活力指标 (中高强度)</div>
          <div class="card-value-wrap">
            <div class="card-value" id="valExercise">--</div>
            <div class="card-unit">分钟</div>
          </div>
          <div class="card-subtext" id="subExercise">今日中高强度活动</div>
        </div>
      </div>
    </div>

    <!-- ====== 体重 ====== -->
    <div id="weightView" style="display:none;">
      <div class="wide-card">
        <div class="card-icon">⚖️</div>
        <div class="card-label">体重趋势（kg）</div>
        <div class="chart-wrap">
          <canvas id="weightChart"></canvas>
        </div>
        <div class="card-subtext" id="weightSummary" style="margin-top:10px;">加载中…</div>
      </div>
    </div>

    <!-- ====== 日历 ====== -->
    <div id="calendarView" style="display:none;">
      <div class="cal-card">
        <div class="cal-nav">
          <button onclick="prevMonth()">‹</button>
          <div class="month" id="monthLabel">--</div>
          <button onclick="nextMonth()">›</button>
          <button class="today-btn" onclick="goToday()">今天</button>
        </div>

        <div class="legend">
          <span><i class="dot-mark"></i>已记录经期</span>
          <span><i class="dot-pred"></i>预测经期</span>
          <span><i style="border:2px solid #9c7bff;width:8px;height:8px;background:#fff;"></i>今天</span>
        </div>

        <div class="cal-week">
          <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>

        <div class="cal-grid" id="calGrid"></div>
      </div>

      <div class="period-status" id="statusCard">
        <div class="big" id="statusTitle">加载中…</div>
        <div class="row"><span>上次起始</span><span id="statusLast">--</span></div>
        <div class="row"><span>下次预测</span><span id="statusNext">--</span></div>
        <div class="row"><span>平均周期</span><span id="statusCycle">--</span></div>
        <div class="row"><span>平均经期</span><span id="statusLen">--</span></div>
      </div>
    </div>

  </div>

  <!-- 弹窗 -->
  <div class="modal-mask" id="modalMask" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h3 id="modalTitle">标记经期</h3>
      <div class="date-str" id="modalDate">--</div>
      <button class="btn-mark" id="btnMark" onclick="doMark()">标记为经期</button>
      <button class="btn-unmark" id="btnUnmark" onclick="doUnmark()">取消标记</button>
      <button class="btn-cancel" onclick="closeModal()">取消</button>
    </div>
  </div>

  <script>
    let weightChart = null;
    let currentView = "today";

    // ========== 视图切换 ==========
    function switchView(view) {
      currentView = view;
      document.querySelectorAll(".view-tab").forEach(b => {
        b.classList.toggle("active", b.dataset.view === view);
      });

      document.getElementById("todayView").style.display = view === "today" ? "block" : "none";
      document.getElementById("weightView").style.display = view === "weight" ? "block" : "none";
      document.getElementById("calendarView").style.display = view === "calendar" ? "block" : "none";

      if (view === "weight") loadWeightChart();
      if (view === "calendar") loadCalendar();
    }

    // ========== 今日 ==========
    async function fetchData() {
      const icon = document.getElementById("refreshIcon");
      if (icon) icon.classList.add("spinning");
      try {
        const resp = await fetch("/health/api/data?t=" + Date.now());
        if (!resp.ok) throw new Error("Network error");
        const res = await resp.json();
        if (res.ok) renderData(res.data || {});
      } catch (e) {
        console.error("加载数据失败", e);
        const st = document.getElementById("statusTime");
        if (st) st.textContent = "数据加载失败，请稍后重试";
      } finally {
        if (icon) setTimeout(() => icon.classList.remove("spinning"), 500);
      }
    }

    function fmtMonthDay(iso) {
      if (!iso) return "";
      const p = String(iso).split("-");
      if (p.length !== 3) return iso;
      return `${parseInt(p[1])} 月 ${parseInt(p[2])} 日`;
    }

    function renderData(data) {
      const hasData = data && Object.keys(data).length > 0 && data.date;
      document.getElementById("emptyState").style.display = hasData ? "none" : "block";
      document.getElementById("dataArea").style.display = hasData ? "block" : "none";

      const recvAt = data && data._received_at;
      document.getElementById("statusTime").textContent = recvAt ? `数据接收于 ${recvAt}` : "暂无数据";
      if (!hasData) return;

      // 经期 + 预测
      const ps = data.period_status || {};
      const nextStr = fmtMonthDay(ps.next_start_date);
      const periodTitle = document.getElementById("periodTitle");
      const periodDesc = document.getElementById("periodDesc");

      if (data.in_period === true) {
        const day = ps.period_day;
        periodTitle.textContent = day ? `今日 · 经期第 ${day} 天` : "今日 · 经期中";
        periodDesc.textContent = nextStr ? `下次预计 ${nextStr} · 多喝温水` : "多喝温水 · 注意休息";
      } else if (data.in_period === false) {
        periodTitle.textContent = "今日 · 不在经期";
        periodDesc.textContent = nextStr ? `下次经期预计 ${nextStr} 开始` : "保持好心情 · 规律作息";
      } else if (nextStr) {
        periodTitle.textContent = "今日 · 经期护理";
        periodDesc.textContent = `下次经期预计 ${nextStr} 开始`;
      } else {
        periodTitle.textContent = "今日 · 经期护理";
        periodDesc.textContent = "暂无经期数据";
      }

      // 心率
      const latest = data.latest_hr != null ? Math.round(data.latest_hr) : null;
      const rest = data.resting_hr ? Math.round(data.resting_hr) : null;
      const walk = data.walking_hr ? Math.round(data.walking_hr) : null;
      const hrVal = latest ?? rest ?? walk;
      if (hrVal != null) {
        document.getElementById("valHr").textContent = hrVal;
        document.getElementById("subHr").textContent = `静息 ${rest ?? "--"} · 步行 ${walk ?? "--"}`;
      } else {
        document.getElementById("valHr").textContent = "--";
        document.getElementById("subHr").textContent = "暂无心率数据";
      }

      // 血氧
      if (data.blood_oxygen_pct != null) {
        document.getElementById("valOxygen").textContent = Math.round(data.blood_oxygen_pct);
        document.getElementById("subOxygen").textContent = "最近一次读数";
      } else {
        document.getElementById("valOxygen").textContent = "--";
        document.getElementById("subOxygen").textContent = "暂无血氧数据";
      }

      // 步数
      if (data.steps != null) {
        document.getElementById("valSteps").textContent = Math.round(data.steps);
        const dist = data.distance_km != null ? Number(data.distance_km).toFixed(2) : "--";
        document.getElementById("subSteps").textContent = `${dist} km`;
      } else {
        document.getElementById("valSteps").textContent = "--";
        document.getElementById("subSteps").textContent = "暂无步数数据";
      }

      // 睡眠
      if (data.sleep && data.sleep.duration_min) {
        const dur = data.sleep.duration_min;
        document.getElementById("valSleepHrs").textContent = (dur / 60).toFixed(1);
        const bed = data.sleep.bedtime, wake = data.sleep.wake_time;
        document.getElementById("subSleep").textContent =
          bed && wake ? `${bed} 入睡 · ${wake} 醒` : "昨晚睡眠";
      } else {
        document.getElementById("valSleepHrs").textContent = "--";
        document.getElementById("subSleep").textContent = "暂无睡眠数据";
      }

      // 活力
      const exMin = (data.activity && data.activity.exercise_min) || 0;
      const standHr = (data.activity && data.activity.stand_hr) || 0;
      document.getElementById("valExercise").textContent = Math.round(exMin);
      document.getElementById("subExercise").textContent =
        `今日中高强度活动 · 站立 ${standHr} 小时`;
    }

    // ========== 体重 ==========
    async function loadWeightChart() {
      const summary = document.getElementById("weightSummary");
      summary.textContent = "加载中…";
      try {
        const resp = await fetch("/health/api/history?t=" + Date.now());
        const res = await resp.json();
        if (!res.ok || !Array.isArray(res.weight)) {
          summary.textContent = "暂无体重数据";
          return;
        }
        const pts = res.weight;
        if (pts.length === 0) {
          summary.textContent = "还没有记录过体重";
          if (weightChart) { weightChart.destroy(); weightChart = null; }
          return;
        }
        const labels = pts.map(p => p.date.slice(5));
        const values = pts.map(p => p.weight);
        const first = values[0], last = values[values.length - 1];
        const diff = (last - first).toFixed(1);
        summary.textContent = `共 ${pts.length} 条记录 · 从 ${pts[0].date} 起 · 变化 ${diff > 0 ? "+" + diff : diff} kg`;

        const ctx = document.getElementById("weightChart").getContext("2d");
        if (weightChart) weightChart.destroy();
        weightChart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [{
              label: "体重 (kg)",
              data: values,
              borderColor: "#9c7bff",
              backgroundColor: "rgba(156,123,255,0.12)",
              borderWidth: 2, tension: 0.35, fill: true,
              pointRadius: 3, pointBackgroundColor: "#9c7bff",
            }],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `${c.parsed.y} kg` } } },
            scales: {
              x: { grid: { display: false }, ticks: { color: "#b5b0c7", font: { size: 10 } } },
              y: { grid: { color: "#f0e9ff" }, ticks: { color: "#b5b0c7", font: { size: 10 } } },
            },
          },
        });
      } catch (e) {
        console.error("加载体重历史失败", e);
        summary.textContent = "加载失败，请稍后重试";
      }
    }

    // ========== 日历 ==========
    let viewYear, viewMonth;
    let calDays = {};       // { "YYYY-MM-DD": bool }
    let calStatus = {};     // period_status
    let selectedDate = null;

    function initCalendarMonth() {
      const now = new Date();
      viewYear = now.getFullYear();
      viewMonth = now.getMonth() + 1;
    }

    async function loadCalendar() {
      if (!viewYear) initCalendarMonth();
      const label = document.getElementById("monthLabel");
      label.textContent = `${viewYear}年${viewMonth}月`;

      // 计算预测区间
      const monthStr = `${viewYear}-${String(viewMonth).padStart(2, "0")}`;
      try {
        const resp = await fetch(`/health/api/period/month?month=${monthStr}&t=${Date.now()}`);
        const res = await resp.json();
        if (res.ok) {
          calDays = res.days || {};
          calStatus = res.period_status || {};
        } else {
          calDays = {};
          calStatus = {};
        }
      } catch (e) {
        console.error("加载日历失败", e);
        calDays = {};
        calStatus = {};
      }
      renderCalendar();
      renderStatusCard();
    }

    function renderCalendar() {
      document.getElementById("monthLabel").textContent = `${viewYear}年${viewMonth}月`;

      const grid = document.getElementById("calGrid");
      grid.innerHTML = "";

      const first = new Date(viewYear, viewMonth - 1, 1);
      const firstDay = first.getDay();
      const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();

      // 预测日期集合
      const predSet = new Set();
      const nextStart = calStatus.next_start_date;
      const avgLen = parseInt(calStatus.avg_length) || 5;
      if (nextStart) {
        const s = new Date(nextStart);
        for (let i = 0; i < avgLen; i++) {
          const d = new Date(s); d.setDate(d.getDate() + i);
          predSet.add(d.toISOString().slice(0, 10));
        }
      }

      const todayStr = new Date().toISOString().slice(0, 10);

      for (let i = 0; i < firstDay; i++) {
        const cell = document.createElement("div");
        cell.className = "cal-cell empty";
        grid.appendChild(cell);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${viewYear}-${String(viewMonth).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const cell = document.createElement("div");
        cell.className = "cal-cell";
        cell.textContent = d;

        if (dateStr === todayStr) cell.classList.add("today");

        // 已标记 = 明确 true
        if (calDays[dateStr] === true) {
          cell.classList.add("marked");
        } else if (predSet.has(dateStr)) {
          cell.classList.add("pred");
        }

        if (cell.classList.contains("marked") || cell.classList.contains("pred")) {
          const dot = document.createElement("div");
          dot.className = "dot";
          cell.appendChild(dot);
        }

        cell.onclick = () => openModal(dateStr);
        grid.appendChild(cell);
      }
    }

    function prevMonth() {
      viewMonth--;
      if (viewMonth < 1) { viewMonth = 12; viewYear--; }
      loadCalendar();
    }
    function nextMonth() {
      viewMonth++;
      if (viewMonth > 12) { viewMonth = 1; viewYear++; }
      loadCalendar();
    }
    function goToday() {
      initCalendarMonth();
      loadCalendar();
    }

    // ========== 弹窗 ==========
    function openModal(dateStr) {
      selectedDate = dateStr;
      document.getElementById("modalDate").textContent = dateStr;
      const isMarked = calDays[dateStr] === true;
      document.getElementById("modalTitle").textContent = isMarked ? "已标记为经期" : "标记经期";
      document.getElementById("btnMark").style.display = isMarked ? "none" : "block";
      document.getElementById("btnUnmark").style.display = isMarked ? "block" : "none";
      document.getElementById("modalMask").classList.add("show");
    }
    function closeModal() {
      document.getElementById("modalMask").classList.remove("show");
      selectedDate = null;
    }
    async function doMark() {
      if (!selectedDate) return;
      try {
        await fetch("/health/api/period/mark", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ date: selectedDate, flow: "中等" }),
        });
        closeModal();
        await loadCalendar();
      } catch (e) {
        console.error("标记失败", e);
        alert("标记失败，请稍后重试");
      }
    }
    async function doUnmark() {
      if (!selectedDate) return;
      try {
        await fetch("/health/api/period/unmark", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ date: selectedDate }),
        });
        closeModal();
        await loadCalendar();
      } catch (e) {
        console.error("取消标记失败", e);
        alert("取消标记失败，请稍后重试");
      }
    }

    // ========== 状态小卡 ==========
    function renderStatusCard() {
      const s = calStatus || {};
      document.getElementById("statusTitle").textContent =
        s.in_period ? `经期第 ${s.period_day} 天` : "不在经期";
      document.getElementById("statusLast").textContent = s.last_start || "--";
      document.getElementById("statusNext").textContent = fmtMonthDay(s.next_start_date) || "--";
      document.getElementById("statusCycle").textContent = (s.avg_cycle || "--") + " 天";
      document.getElementById("statusLen").textContent = (s.avg_length || "--") + " 天";
    }

    // ========== 启动 ==========
    fetchData();
    setInterval(() => {
      if (currentView === "today") fetchData();
    }, 30000);
  </script>
</body>
</html>
